name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: pnpm fmt:check
      - run: pnpm test
      - run: shellcheck -x dist/codex-provider-setup.sh tests/adapters/runtime.sh tests/shell/codex-provider-setup.Tests.sh
      - name: Create checksums
        run: |
          cd dist
          sha256sum codex-provider-setup.ps1 codex-provider-setup.sh > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/codex-provider-setup.ps1
            dist/codex-provider-setup.sh
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/codex-provider-setup.ps1
            dist/codex-provider-setup.sh
            dist/SHA256SUMS
