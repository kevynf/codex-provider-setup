name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Prepare Pages files
        run: |
          mkdir public
          cp dist/codex-provider-setup.ps1 public/setup.ps1
          cp dist/codex-provider-setup.sh public/setup.sh
          cp dist/claude-provider-setup.ps1 public/claude-provider-setup.ps1
          cp dist/claude-provider-setup.sh public/claude-provider-setup.sh
          cp dist/claude-provider-setup.ps1 public/cc-setup.ps1
          cp dist/claude-provider-setup.sh public/cc-setup.sh
          cd public
          sha256sum setup.ps1 setup.sh claude-provider-setup.ps1 claude-provider-setup.sh cc-setup.ps1 cc-setup.sh > SHA256SUMS
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
